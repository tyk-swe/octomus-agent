[package]
name = "octomus-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Continuous, reviewed repository improvement through Codex or OpenCode"
repository = "https://github.com/tyk-swe/octomus-agent"
homepage = "https://github.com/tyk-swe/octomus-agent"
readme = "README.md"
keywords = ["codex", "automation", "github", "agent", "code-review"]
categories = ["development-tools", "command-line-utilities"]
include = ["/src/**", "/tests/*.rs", "/tests/common/**", "/tests/fixtures/*.py", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/web/build/**", "/README.md", "/LICENSE", "/SECURITY.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/AGENTS.md", "/docs/**", "/deploy/**"]

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
futures = "0.3"
libc = "0.2"
include_dir = "0.7"
mime_guess = "2"
percent-encoding = "2"
regex = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
# One unsafe block exists, in the process-group kill. Denying by default means a
# second one has to announce itself in review rather than blend in.
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
