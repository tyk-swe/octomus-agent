[package]
name = "octomus-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Continuous, reviewed repository improvement through Codex"
repository = "https://github.com/tyk-swe/octomus-agent"
homepage = "https://github.com/tyk-swe/octomus-agent"
readme = "README.md"
keywords = ["codex", "automation", "github", "agent", "code-review"]
categories = ["development-tools", "command-line-utilities"]
include = ["/src/**", "/tests/*.rs", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/web/build/**", "/README.md", "/LICENSE", "/SECURITY.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/CODE_OF_CONDUCT.md", "/AGENTS.md", "/PRD.md", "/docs/**", "/deploy/**"]

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
futures = "0.3"
libc = "0.2"
include_dir = "0.7"
mime_guess = "2"
percent-encoding = "2"
regex = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
