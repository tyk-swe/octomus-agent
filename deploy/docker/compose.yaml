# Octomus on one Docker host, sandboxed by default. See docs/deployment.md.
#
#   octomus    control plane: state, scheduler, dashboard (127.0.0.1:4200 only) and GitHub publication
#   sandboxd   broker: the only holder of the Docker socket; no network at all
#   egress     gateway: the only way out for sandboxes, allowlisted per sandbox kind
#   login      one-off runner logins into the runner volume (docker compose run --rm login codex login --device-auth),
#              reaching out only through the egress gateway, like a runner sandbox
#
# Every agent turn and verification command runs in its own short-lived sandbox container that the broker builds.
name: octomus

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  restart: unless-stopped
  user: "10001:10001"
  tmpfs: ["/tmp:size=64m"]
  # Rotated, so nothing a sandbox makes the gateway log can fill the host's disk.
  logging: &logging
    driver: local
    options: {max-size: 10m, max-file: "5"}

x-egress-hosts: &egress-hosts
  OCTOMUS_EGRESS_MODEL_HOSTS: ${OCTOMUS_EGRESS_MODEL_HOSTS-chatgpt.com,auth.openai.com,api.openai.com}
  OCTOMUS_EGRESS_BUILD_HOSTS: ${OCTOMUS_EGRESS_BUILD_HOSTS:-}

services:
  octomus:
    <<: *hardened
    image: ${OCTOMUS_IMAGE:-octomus-agent:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["--listen", "0.0.0.0:4200", "--sandbox", "docker"]
    environment:
      <<: *egress-hosts
      OCTOMUS_TOKEN_FILE: /run/secrets/operator_token
      OCTOMUS_GITHUB_TOKEN_FILE: /run/secrets/github_token
      OCTOMUS_GITHUB_REPO: ${OCTOMUS_GITHUB_REPO:?Set OCTOMUS_GITHUB_REPO in .env}
      OCTOMUS_SANDBOXD_SOCKET: /run/octomus/sandboxd.sock
    secrets: [operator_token, github_token]
    volumes:
      - data:/var/lib/octomus/data
      - broker:/run/octomus
    ports:
      - "127.0.0.1:${OCTOMUS_PORT:-4200}:4200"
    networks: [control]
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "/usr/local/bin/octomus-agent", "--healthcheck", "--listen", "0.0.0.0:4200"]
      interval: 30s
      timeout: 5s
      start_period: 10m
    depends_on:
      sandboxd:
        condition: service_healthy
      egress:
        condition: service_started

  sandboxd:
    <<: *hardened
    image: ${OCTOMUS_IMAGE:-octomus-agent:local}
    command: ["--sandboxd"]
    group_add: ["${DOCKER_GID:?Run ./setup.sh or set DOCKER_GID to the docker socket group}"]
    network_mode: none
    environment:
      OCTOMUS_SANDBOXD_SOCKET: /run/octomus/sandboxd.sock
      OCTOMUS_DATA_DIR: /var/lib/octomus/data
      OCTOMUS_SANDBOX_IMAGE: ${OCTOMUS_SANDBOX_IMAGE:-octomus-sandbox:local}
      OCTOMUS_SANDBOX_DATA_VOLUME: octomus-data
      OCTOMUS_SANDBOX_RUNNER_VOLUME: octomus-runner
      OCTOMUS_SANDBOX_TOOLS_VOLUME: octomus-tools
      OCTOMUS_SANDBOX_RUNNER_NETWORK: octomus-sandbox-runner
      OCTOMUS_SANDBOX_VERIFY_NETWORK: octomus-sandbox-verify
      OCTOMUS_SANDBOX_INSTANCE: ${OCTOMUS_SANDBOX_INSTANCE:-octomus}
      OCTOMUS_SANDBOX_CPUS: ${OCTOMUS_SANDBOX_CPUS:-2}
      OCTOMUS_SANDBOX_MEMORY: ${OCTOMUS_SANDBOX_MEMORY:-4g}
      OCTOMUS_SANDBOX_PIDS: ${OCTOMUS_SANDBOX_PIDS:-1024}
      OCTOMUS_SANDBOX_TMPFS: ${OCTOMUS_SANDBOX_TMPFS:-1g}
      OCTOMUS_SANDBOX_MAX: ${OCTOMUS_SANDBOX_MAX:-12}
      OCTOMUS_SANDBOX_RUNTIME: ${OCTOMUS_SANDBOX_RUNTIME:-}
      OCTOMUS_EGRESS_PROXY: egress:3128
      OCTOMUS_EGRESS_LEASES: /run/octomus-egress
      OCTOMUS_EGRESS_COLLECTOR: /run/octomus-egress/collector.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - broker:/run/octomus
      - data:/var/lib/octomus/data:ro
      - runner:/var/lib/octomus/runner
      - tools:/opt/octomus-tools
      - egress-state:/run/octomus-egress
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/octomus-agent", "--sandboxd-check"]
      interval: 10s
      timeout: 5s
      start_period: 60s

  egress:
    <<: *hardened
    image: ${OCTOMUS_IMAGE:-octomus-agent:local}
    command: ["--egress"]
    environment:
      <<: *egress-hosts
      OCTOMUS_EGRESS_LISTEN: ":3128"
      OCTOMUS_EGRESS_LEASES: /run/octomus-egress
      OCTOMUS_EGRESS_COLLECTOR: /run/octomus-egress/collector.sock
    volumes:
      - egress-state:/run/octomus-egress
    # Sandboxes decide how many tunnels and requests the gateway handles; bound what that can cost the host.
    mem_limit: 512m
    pids_limit: 512
    networks:
      sandbox-runner:
        aliases: [egress]
      sandbox-verify:
        aliases: [egress]
      egress-out: {}

  # The base sandbox image, under a fixed tag that derived images build FROM: `docker compose build octomus sandbox-image`.
  # The broker and logins use OCTOMUS_SANDBOX_IMAGE, which may name a derived image instead.
  sandbox-image:
    image: octomus-sandbox:local
    build:
      context: .
      dockerfile: sandbox.Dockerfile
    profiles: [build]
    network_mode: none
    entrypoint: ["true"]
    logging: *logging

  # Issues the login its egress lease, as the broker does for a runner sandbox, and replaces the previous login's lease.
  # `docker compose run login` runs it first; it has no network and sees no runner state.
  login-lease:
    <<: *hardened
    image: ${OCTOMUS_IMAGE:-octomus-agent:local}
    # Like the broker, tool services use only images already on this host and never pull one.
    pull_policy: never
    profiles: [tools]
    restart: "no"
    network_mode: none
    command: ["--login-lease"]
    environment:
      OCTOMUS_EGRESS_LEASES: /run/octomus-egress
      OCTOMUS_EGRESS_PROXY: egress:3128
      OCTOMUS_LOGIN_PROXY_FILE: /run/octomus-login/proxy
    volumes:
      - egress-state:/run/octomus-egress
      - login-proxy:/run/octomus-login

  login:
    image: ${OCTOMUS_SANDBOX_IMAGE:-octomus-sandbox:local}
    pull_policy: never
    profiles: [tools]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    mem_limit: 2g
    pids_limit: 512
    logging: *logging
    depends_on:
      egress:
        condition: service_started
      login-lease:
        condition: service_completed_successfully
    # Runner sandboxes can write the runner volume, so a login must not run what they left there with more reach than
    # they have: it joins the runner sandboxes' internal network, reaches out only through the egress gateway under
    # the runner allowlist, and loads no OpenCode configuration, plugins or cache from the volume.
    entrypoint:
      - /bin/sh
      - -euc
      - |
        proxy=$$(cat /run/octomus-login/proxy)
        export HTTP_PROXY=$$proxy HTTPS_PROXY=$$proxy ALL_PROXY=$$proxy http_proxy=$$proxy https_proxy=$$proxy all_proxy=$$proxy
        exec "$$@"
      - login
    environment:
      HOME: /home/octomus
      XDG_CONFIG_HOME: /tmp/config
      XDG_CACHE_HOME: /tmp/cache
      XDG_STATE_HOME: /tmp/state
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1
    tmpfs: ["/home/octomus:uid=10001,gid=10001,mode=0700", "/tmp:size=256m"]
    # Only the logins themselves land in the runner volume, where runner sandboxes mount them. The broker creates these
    # subdirectories when it starts, so run logins after `docker compose up -d`.
    volumes:
      - {type: volume, source: runner, target: /home/octomus/.codex, volume: {subpath: codex}}
      - {type: volume, source: runner, target: /home/octomus/.local/share/opencode, volume: {subpath: opencode/data}}
      - login-proxy:/run/octomus-login:ro
    networks: [sandbox-runner]

secrets:
  operator_token:
    file: ./secrets/operator_token
  github_token:
    file: ./secrets/github_token

volumes:
  data:
    name: octomus-data
  runner:
    name: octomus-runner
  tools:
    name: octomus-tools
  broker: {}
  egress-state: {}
  login-proxy: {}

networks:
  control: {}
  egress-out: {}
  sandbox-runner:
    name: octomus-sandbox-runner
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  sandbox-verify:
    name: octomus-sandbox-verify
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
