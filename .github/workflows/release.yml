name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, update notes, or retry retained images
        required: true
      notes:
        description: Optional release notes; an existing release receives only a notes update
        required: false
permissions:
  contents: read
# Queue retries for the same version. Cancelling an upload or promotion only creates more recovery work.
concurrency:
  group: release-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  GH_REPO: ${{ github.repository }}
  GH_HOST: github.com
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The list-releases API exposes drafts only to a push-capable identity. This job performs reads only.
      contents: write
    outputs:
      mode: ${{ steps.operation.outputs.mode }}
      source: ${{ steps.operation.outputs.source }}
      version: ${{ steps.operation.outputs.version }}
    steps:
      # Use this workflow's scripts even for a historical tag that predates them. Build jobs check out source below.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Choose notes, first build, or recovery from retained inputs
        id: operation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: python3 scripts/release.py prepare

  # Nothing in the build/test graph runs for notes edits or an existing release's image/signing retry.
  verify:
    needs: prepare
    if: needs.prepare.outputs.mode == 'build'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.source }}

  notes:
    needs: prepare
    if: needs.prepare.outputs.mode == 'notes'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Update only the description and preserve the input receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: python3 scripts/release.py notes

  # Draft creation atomically pins the accepted source, original run and all asset hashes. An interrupted
  # upload resumes those same bytes; only a complete verified asset set becomes public.
  publish:
    needs: [prepare, verify]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          ((needs.prepare.outputs.mode == 'build' && needs.verify.result == 'success') ||
           needs.prepare.outputs.mode == 'retry') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Publish or resume the original accepted inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          RELEASE_SOURCE: ${{ needs.prepare.outputs.source }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: python3 scripts/release.py stage

  # Release ordering is deliberate: version-tagged images can only come from permanent, published release
  # assets. OCI archives already contain both native accepted manifests, SBOMs and provenance; never rebuild here.
  images:
    needs: [prepare, publish]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' && needs.publish.result == 'success' &&
          needs.prepare.outputs.mode != 'notes' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify the permanent release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ needs.prepare.outputs.source }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release.py download --directory dist/release
      - name: Install OCI transfer tools
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - uses: sigstore/cosign-installer@v3
      # Both Skopeo and Cosign read the Docker credential file written by this action.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote and sign the accepted image digests
        env:
          RELEASE_SOURCE: ${{ needs.prepare.outputs.source }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: >-
          python3 scripts/release-images.py promote --directory dist/release/images
          --source "$RELEASE_SOURCE" --version "$RELEASE_VERSION" --tag "$RELEASE_TAG"
          --repository "ghcr.io/${OWNER,,}"

  # Install published archives exactly as documented, including their release checksums, on both native hosts.
  install:
    needs: [prepare, publish]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' && needs.publish.result == 'success' &&
          needs.prepare.outputs.mode != 'notes' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Install the published release
        env:
          EXPECT_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECT_ARCH"
          url="https://raw.githubusercontent.com/$GH_REPO/$RELEASE_TAG/install.sh"
          for attempt in 1 2 3; do
            curl --proto '=https' --proto-redir '=https' -fsSL "$url" -o "$RUNNER_TEMP/install.sh" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 5
          done
          # Assets can lag the release record briefly; every retry re-verifies the package checksum.
          for attempt in 1 2 3; do
            if sh "$RUNNER_TEMP/install.sh" "$RELEASE_TAG"; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
          version=$(/usr/local/bin/octomus-agent --version)
          test "$version" = "octomus-agent ${RELEASE_TAG#v}"
          {
            echo "### Install check ($EXPECT_ARCH)"
            echo "- Host: $(. /etc/os-release && echo "$PRETTY_NAME")"
            echo "- Architecture: $(uname -m)"
            echo "- Version output: \`$version\`"
          } >> "$GITHUB_STEP_SUMMARY"
