name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
      notes:
        description: Optional release notes replacing generated notes
        required: false
permissions:
  contents: read
jobs:
  # The full checks build, smoke-test and upload both native archives; publish releases those.
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
  # Ordering: the release must exist before anything version-tagged is published. A run that
  # fails at `publish` pushes no image, so no version tag can outlive a release that never shipped.
  images:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: octomus-agent
            context: .
            file: deploy/docker/Dockerfile
          - image: octomus-sandbox
            context: deploy/docker
            file: deploy/docker/sandbox.Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: name
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: echo "ref=ghcr.io/${OWNER,,}/${{ matrix.image }}:${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.image }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.ref }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign the pushed digest
        env:
          IMAGE_REF: ${{ steps.name.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF%:*}@${DIGEST}"
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          cd dist
          # Archive names carry v plus the VERSION file, so this also checks the tag.
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            test -f "octomus-agent-$RELEASE_TAG-$target.tar.gz" || { echo "No $target archive named for $RELEASE_TAG; the tag must be v plus VERSION" >&2; exit 1; }
          done
          sha256sum -- *.tar.gz > SHA256SUMS
          printf '%s\n' "$RELEASE_NOTES" > /tmp/octomus-release-notes.md
          options=(--verify-tag)
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          if [[ -n "$RELEASE_NOTES" ]]; then
            options+=(--notes-file /tmp/octomus-release-notes.md)
          else
            options+=(--generate-notes)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ -z "$RELEASE_NOTES" ]]; then
              echo 'Release already exists; supply notes to update its description. Assets will not be replaced.' >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --notes-file /tmp/octomus-release-notes.md
          else
            gh release create "$RELEASE_TAG" "${options[@]}" ./*.tar.gz SHA256SUMS
          fi
  # Installs the published release exactly as documented: the tagged installer, its release
  # assets and checksums, on a fresh x86_64 and a native aarch64 Ubuntu 24.04 host.
  install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install the published release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECT_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECT_ARCH"
          url="https://raw.githubusercontent.com/${{ github.repository }}/$RELEASE_TAG/install.sh"
          for attempt in 1 2 3; do
            curl --proto '=https' --proto-redir '=https' -fsSL "$url" -o "$RUNNER_TEMP/install.sh" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 5
          done
          # Assets can lag the release record briefly; retry the whole install, which re-verifies checksums.
          for attempt in 1 2 3; do
            if sh "$RUNNER_TEMP/install.sh" "$RELEASE_TAG"; then break; fi
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
          version=$(/usr/local/bin/octomus-agent --version)
          test "$version" = "octomus-agent ${RELEASE_TAG#v}"
          {
            echo "### Install check ($EXPECT_ARCH)"
            echo "- Host: $(. /etc/os-release && echo "$PRETTY_NAME")"
            echo "- Architecture: $(uname -m)"
            echo "- Version output: \`$version\`"
          } >> "$GITHUB_STEP_SUMMARY"
