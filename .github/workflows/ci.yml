name: Repository checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Keep setup inline so historical release refs do not need a local action.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: shellcheck install.sh scripts/*.sh deploy/docker/*.sh
      - run: make check
      - run: make audit

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: make test-go test-go-race

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npx --prefix web playwright install --with-deps chromium
      - run: make test-integration test-browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: web/test-results
          retention-days: 7

  # The release workflow publishes these archives, so it never rebuilds what CI smoke-tested.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: make package
      - name: Smoke test the native ${{ matrix.target }} archive
        run: |
          tar -xzf dist/octomus-agent-*.tar.gz -C "$RUNNER_TEMP"
          OCTOMUS_TEST_BINARY="$RUNNER_TEMP/octomus-agent/octomus-agent" python3 tests/distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  client-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - client: '@openai/codex@0.153.4'
            bin: codex
            env: OCTOMUS_CONTRACT_CODEX_BINARY
            test: TestPinnedCodexContract
          - client: opencode-ai@1.18.30
            bin: opencode
            env: OCTOMUS_CONTRACT_OPENCODE_BINARY
            test: TestPinnedOpenCodeContract
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install pinned ${{ matrix.bin }}
        run: |
          npm install --prefix "$RUNNER_TEMP/client" --no-audit --no-fund '${{ matrix.client }}'
          echo "${{ matrix.env }}=$RUNNER_TEMP/client/node_modules/.bin/${{ matrix.bin }}" >> "$GITHUB_ENV"
      - name: Real client, synthetic provider contract
        run: go test ./internal/runner -run '^${{ matrix.test }}$' -count=1 -v

  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - id: sandbox_tests
        run: make test-sandbox
      - name: Sandbox runtime diagnostics
        if: failure() && steps.sandbox_tests.outcome == 'failure'
        run: |
          docker info --format 'ServerVersion={{.ServerVersion}} CgroupDriver={{.CgroupDriver}} CgroupVersion={{.CgroupVersion}} KernelVersion={{.KernelVersion}}'

  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [quality, go, e2e, package, client-contracts, sandbox]
    steps:
      - name: All jobs succeeded
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
