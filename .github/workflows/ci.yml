name: Repository checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: shellcheck install.sh scripts/*.sh
      - run: make check
      - run: make audit
      - run: npx --prefix web playwright install --with-deps chromium
      - run: make test
      - run: make package
      - run: python3 tests/distribution.py --package "dist/octomus-agent-v$(cat VERSION)-x86_64-unknown-linux-gnu.tar.gz"
      - run: sudo python3 tests/systemd.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: web/test-results
          retention-days: 7

  go-storage-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: npm ci --prefix web
      - run: make test-go-storage

  client-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [codex, opencode]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci --prefix web && npm run build --prefix web
      - name: Install pinned client
        run: |
          if [ '${{ matrix.backend }}' = codex ]; then
            npm install --prefix "$RUNNER_TEMP/octomus-contract-client" --no-audit --no-fund @openai/codex@0.153.4
            echo "OCTOMUS_CONTRACT_CODEX_BINARY=$RUNNER_TEMP/octomus-contract-client/node_modules/.bin/codex" >> "$GITHUB_ENV"
          else
            npm install --prefix "$RUNNER_TEMP/octomus-contract-client" --no-audit --no-fund opencode-ai@1.18.30
            echo "OCTOMUS_CONTRACT_OPENCODE_BINARY=$RUNNER_TEMP/octomus-contract-client/node_modules/.bin/opencode" >> "$GITHUB_ENV"
          fi
      - name: Real client, synthetic provider contracts
        run: cargo test --locked --test contracts pinned_${{ matrix.backend }}_contract -- --ignored --nocapture
      - name: Go pinned client contract
        run: |
          if [ '${{ matrix.backend }}' = codex ]; then
            go test ./internal/runner -run '^TestPinnedCodexContract$' -count=1 -v
          else
            go test ./internal/runner -run '^TestPinnedOpenCodeContract$' -count=1 -v
          fi
