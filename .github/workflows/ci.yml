name: Repository checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: shellcheck install.sh scripts/*.sh deploy/docker/*.sh
      - run: make check
      - run: make audit

  go-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: regular
            target: test-go
          - mode: race
            target: test-go-race
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Go tests (${{ matrix.mode }})
        run: make ${{ matrix.target }}

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: e2e
          - args: hardening
          - args: baseline notifications runners
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: make test-integration INTEGRATION_SCENARIOS="${{ matrix.args }}"

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npx --prefix web playwright install --with-deps chromium
      - run: make test-browser PLAYWRIGHT_ARGS="--project=${{ matrix.project }}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence-${{ matrix.project }}
          path: web/test-results
          retention-days: 7

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: make test-contracts package
      - run: python3 tests/distribution.py --package "dist/octomus-agent-v$(cat VERSION)-x86_64-unknown-linux-gnu.tar.gz"

  client-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [codex, opencode]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install pinned client
        run: |
          if [ '${{ matrix.backend }}' = codex ]; then
            npm install --prefix "$RUNNER_TEMP/octomus-contract-client" --no-audit --no-fund @openai/codex@0.153.4
            echo "OCTOMUS_CONTRACT_CODEX_BINARY=$RUNNER_TEMP/octomus-contract-client/node_modules/.bin/codex" >> "$GITHUB_ENV"
          else
            npm install --prefix "$RUNNER_TEMP/octomus-contract-client" --no-audit --no-fund opencode-ai@1.18.30
            echo "OCTOMUS_CONTRACT_OPENCODE_BINARY=$RUNNER_TEMP/octomus-contract-client/node_modules/.bin/opencode" >> "$GITHUB_ENV"
          fi
      - name: Real client, synthetic provider contracts
        run: |
          if [ '${{ matrix.backend }}' = codex ]; then
            go test ./internal/runner -run '^TestPinnedCodexContract$' -count=1 -v
          else
            go test ./internal/runner -run '^TestPinnedOpenCodeContract$' -count=1 -v
          fi

  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Docker Engine supports isolated internal networks
        run: |
          docker version
          major=$(docker version --format '{{.Server.Version}}' | cut -d. -f1)
          test "$major" -ge 28
      - name: Compose file validates
        run: |
          docker compose -f deploy/docker/compose.yaml config --quiet
        env:
          OCTOMUS_GITHUB_REPO: owner/repository
          DOCKER_GID: '999'
      - id: sandbox_tests
        run: make test-sandbox
      - name: Sandbox runtime diagnostics
        if: failure() && steps.sandbox_tests.outcome == 'failure'
        run: |
          docker info --format 'ServerVersion={{.ServerVersion}} CgroupDriver={{.CgroupDriver}} CgroupVersion={{.CgroupVersion}} KernelVersion={{.KernelVersion}}'

  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [quality, go-tests, integration, browser, package, client-contracts, sandbox]
    steps:
      - name: All jobs succeeded
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.go-tests.result }}" = success
          test "${{ needs.integration.result }}" = success
          test "${{ needs.browser.result }}" = success
          test "${{ needs.package.result }}" = success
          test "${{ needs.client-contracts.result }}" = success
          test "${{ needs.sandbox.result }}" = success
