name: Weekly scale check
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true
      - name: Measure bounded history over 100,000 records
        env:
          OCTOMUS_SCALE_TEST: '1'
        run: go test ./internal/store -run '^TestBoundedHistoryScale$' -count=1 -timeout=15m -v
